[project]
name = "ai-agent-project"
version = "0.1.0"
description = "Educational project for building a permission-aware internal company AI agent"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.1",
    "nicegui>=3.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1.0",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.55.0",
    "torch>=2.9.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_assistant"]

# Nothing in this project uses a GPU (Groq handles all LLM inference
# remotely; the local sentence-transformers embedding model runs on CPU).
# torch is promoted to a direct dependency (above) purely so this source
# override applies to it (uv only honors [tool.uv.sources] for direct
# dependencies, and torch is otherwise pulled in transitively by
# sentence-transformers) — pinned to the CPU-only wheel index on Linux so
# the default CUDA build (several GB of unused nvidia-* libraries) is never
# resolved there. macOS already gets a lean CPU/MPS build from the normal
# index, so no override is needed for that platform.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
